services:
    kauno_problemos_gateway:
        build:
            context: ..
            dockerfile: kauno_problemos_gateway/Dockerfile
        container_name: kauno_problemos_gateway
        restart: unless-stopped
        ports:
            - "3000:3000"
        env_file:
            - ../kauno_problemos_gateway/.env
        volumes:
            - ../kauno_problemos_gateway:/kauno_problemos_gateway
            - ../kauno_problemos_viisp_handler:/kauno_problemos_gateway/node_modules/viisp-nodejs-auth-handler
        networks:
            - proxy

    kauno_problemos_nginx:
        image: nginx:latest
        container_name: kauno-problemos-nginx
        restart: always
        volumes:
            - ./docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/html
        ports:
            - "80:80"
        networks:
            - proxy
        depends_on:
            - kauno_problemos_php
            - kauno_problemos_postgres
            - kauno_problemos_gateway
            - swagger

    swagger:
        image: swaggerapi/swagger-ui:v5.18.2
        container_name: kauno-problemos-swagger
        restart: always
        environment:
            SWAGGER_JSON: /tmp/openapi.yaml
            BASE_URL: /swagger
        volumes:
            - ./app/docs/openapi.yaml:/tmp/openapi.yaml:ro
        networks:
            - proxy

    kauno_problemos_php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: kauno-problemos-php
        working_dir: /var/www/html/app
        restart: always
        volumes:
            - ./:/var/www/html
            - ./docker/php/fpm-clear-env.conf:/usr/local/etc/php-fpm.d/zz-clear-env.conf:ro
            - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        networks:
            - proxy
        depends_on:
            - kauno_problemos_postgres
            - kauno_problemos_gateway
        ports:
            - "5174:5174"
            - "9003:9003"

    kauno_problemos_postgres:
        image: postgres:16
        container_name: kauno-problemos-postgres
        restart: always
        environment:
            POSTGRES_DB: kauno_problemos_db
            POSTGRES_USER: kauno_problemos_admin
            POSTGRES_PASSWORD: kauno_problemos_admin
        volumes:
            - dbdata:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        networks:
            - proxy

networks:
    proxy:
        external: true

volumes:
    dbdata:

                $ref: "#/components/schemas/FileUploadSettingsResponse"
        "401":
          description: Unauthorized

  /api/reporter/problems:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter own problems list (all statuses)"
      description: >
        Returns ALL problems reported by the authenticated reporter - every status,
        including archived/merged children - matching the Reporter page 'Sąrašas' in
        the web app. Optional query parameters narrow the result by free text, report
        number, category, and date range.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: report_number
          required: false
          schema:
            type: string
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporterProblemsListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden not reporter

  /api/reporter/map:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter dashboard map (own + public problems)"
      description: >
        Returns problems for the authenticated reporter's dashboard map.
        Default: all publicly published problems (any reporter) + the authenticated
        reporter's own problems regardless of publish state. With ?only_mine=1 only
        the authenticated reporter's own problems are returned. The reporter's own
        problems with status "neuzregistruota" are returned as "nauja" (display-only
        normalization for the map).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: only_mine
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMapResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden not reporter

  /api/reporter/problems/{problem}:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter own problem details"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporterProblemShowResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden not reporter
        "404":
          description: Not found

  /api/reporter/statistics:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter statistics authenticated"
      description: "Same data model used by the web reporter statistics page."
      security:

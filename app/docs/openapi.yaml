      parameters:
        - in: query
          name: period
          required: false
          description: "Period filter. If omitted, full scope is returned."
          schema:
            type: string
            enum: [all, 6, 12, year, week, month, quarter]
            default: all
          example: 12
        - in: query
          name: category
          required: false
          description: "Category name or all."
          schema:
            type: string
            default: all
          example: all
        - in: query
          name: date_from
          required: false
          description: "Optional date-from filter (YYYY-MM-DD)."
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - in: query
          name: date_to
          required: false
          description: "Optional date-to filter (YYYY-MM-DD)."
          schema:
            type: string
            format: date
          example: "2026-12-31"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporterStatisticsResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden not reporter

  /api/reporter/report-meta:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter report metadata"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporterReportMetaResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden not reporter


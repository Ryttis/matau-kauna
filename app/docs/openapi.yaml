openapi: 3.0.3

info:
  title: Kauno problemos (Web + API)
  version: 1.0.0
  description: >
    OpenAPI specification for all application endpoints (HTML/Inertia pages and JSON endpoints).
    Authenticated endpoints use Laravel session cookie (`laravel_session`).

servers:
  - url: http://localhost
    description: Local app (Docker nginx)

tags:
  - name: Public
    description: Public pages and public data
  - name: Auth
    description: Login, registration, verification, password reset, logout
  - name: Reporter
    description: Reporter-only flows
  - name: Problems
    description: Problem operations
  - name: Map
    description: Map and geocoding/search
  - name: Automation
    description: Automation rules (staff)
  - name: Statistics
    description: Statistics (staff) and exports
  - name: Settings
    description: User settings and profile
  - name: Admin
    description: Admin area endpoints

paths:
  /:
    get:
      tags: [Public]
      summary: Landing page
      description: Public landing page.
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /faq:
    get:
      tags: [Public]
      summary: FAQ page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /privacy:
    get:
      tags: [Public]
      summary: Privacy policy page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /slapukai:
    get:
      tags: [Public]
      summary: Cookies page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /contacts:
    get:
      tags: [Public]
      summary: Contacts page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /help:
    get:
      tags: [Public]
      summary: Help page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /statistika:
    get:
      tags: [Public]
      summary: Public statistics page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /statistika/duomenys:
    get:
      tags: [Public]
      summary: Public statistics data
      description: Returns public statistics as JSON.
      parameters:
        - $ref: '#/components/parameters/periodQuery'
        - $ref: '#/components/parameters/categoryQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatisticsResponse'

  /reports:
    get:
      tags: [Public]
      summary: Public reports map
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /reports/{problem}:
    get:
      tags: [Public]
      summary: Public report view
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '404':
          $ref: '#/components/responses/NotFound'

  /login:
    get:
      tags: [Auth]
      summary: Login page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
    post:
      tags: [Auth]
      summary: Login
      description: Creates a Laravel session and redirects.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /register:
    get:
      tags: [Auth]
      summary: Registration page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
    post:
      tags: [Auth]
      summary: Register
      description: Creates a reporter user account and redirects.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /register/invite/{token}:
    get:
      tags: [Auth]
      summary: Invitation registration page
      parameters:
        - $ref: '#/components/parameters/tokenPath'
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Auth]
      summary: Complete invitation registration
      parameters:
        - $ref: '#/components/parameters/tokenPath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /forgot-password:
    get:
      tags: [Auth]
      summary: Forgot password page
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
    post:
      tags: [Auth]
      summary: Send password reset email
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reset-password/{token}:
    get:
      tags: [Auth]
      summary: Reset password page
      parameters:
        - $ref: '#/components/parameters/tokenPath'
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reset-password:
    post:
      tags: [Auth]
      summary: Reset password (submit)
      description: Submits the new password using the reset token (Laravel default).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /verify-email:
    get:
      tags: [Auth]
      summary: Verify email notice page
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /email/verify/{id}/{hash}:
    get:
      tags: [Auth]
      summary: Verify email
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/hashPath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /email/verification-notification:
    post:
      tags: [Auth]
      summary: Resend verification email
      security: [{ cookieAuth: [] }]
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many requests

  /role-select:
    get:
      tags: [Auth]
      summary: Role select page
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Auth]
      summary: Set active role
      security: [{ cookieAuth: [] }]
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /logout:
    post:
      tags: [Auth]
      summary: Logout
      security: [{ cookieAuth: [] }]
      responses:
        '302':
          $ref: '#/components/responses/Redirect'

  /reporter/terms:
    get:
      tags: [Reporter]
      summary: Reporter terms page
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Reporter]
      summary: Accept reporter terms
      security: [{ cookieAuth: [] }]
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /dashboard:
    get:
      tags: [Problems]
      summary: Dashboard
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reporter/sarasas:
    get:
      tags: [Reporter]
      summary: Reporter list page
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /reporter/statistics:
    get:
      tags: [Reporter]
      summary: Reporter statistics page
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'

  /reporter/report:
    get:
      tags: [Reporter]
      summary: Report problem page
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
    post:
      tags: [Reporter]
      summary: Create problem (reporter)
      description: Creates a problem and returns JSON.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/uploadChannelHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReporterProblemCreateRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/ReporterProblemCreateRequest' }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/ReporterProblemCreateRequest'
                - type: object
                  properties:
                    files:
                      type: array
                      items: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, problem_id]
                properties:
                  ok: { type: boolean, example: true }
                  problem_id: { type: integer, example: 123 }
        '403':
          $ref: '#/components/responses/ForbiddenJson'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reporter/wizard-dismissed:
    post:
      tags: [Reporter]
      summary: Dismiss reporter wizard
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '403':
          $ref: '#/components/responses/ForbiddenJson'

  /reporter/terms-accepted:
    post:
      tags: [Reporter]
      summary: Mark terms accepted (JSON)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '403':
          $ref: '#/components/responses/ForbiddenJson'

  /file-upload-settings:
    get:
      tags: [Settings]
      summary: File upload settings (JSON)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /problems/{problem}/review-progress:
    get:
      tags: [Problems]
      summary: Review progress page
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Problems]
      summary: Add review progress entry
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /problems/{problem}/watch:
    post:
      tags: [Problems]
      summary: Toggle watch (JSON)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  watched: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'

  /problems/{problem}/attachments:
    post:
      tags: [Problems]
      summary: Upload attachments
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
        - $ref: '#/components/parameters/uploadChannelHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: OK (JSON)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '302':
          $ref: '#/components/responses/Redirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /problems/{problem}/attachments/{attachment}:
    delete:
      tags: [Problems]
      summary: Delete attachment
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
        - $ref: '#/components/parameters/attachmentPath'
      responses:
        '200':
          description: OK (JSON)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '302':
          $ref: '#/components/responses/Redirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /automation:
    get:
      tags: [Automation]
      summary: Automation rules page
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Automation]
      summary: Create automation rule
      security: [{ cookieAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /automation/inactive-reporter-setting:
    put:
      tags: [Automation]
      summary: Update inactive reporter setting
      security: [{ cookieAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '422':
          $ref: '#/components/responses/ValidationError'

  /automation/{rule}:
    put:
      tags: [Automation]
      summary: Update automation rule
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/rulePath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
    delete:
      tags: [Automation]
      summary: Delete automation rule
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/rulePath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'

  /automation/publish-rules:
    post:
      tags: [Automation]
      summary: Create publish rule
      security: [{ cookieAuth: [] }]
      responses:
        '302':
          $ref: '#/components/responses/Redirect'

  /automation/publish-rules/{publish_rule}:
    put:
      tags: [Automation]
      summary: Update publish rule
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/publishRulePath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
    delete:
      tags: [Automation]
      summary: Delete publish rule
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/publishRulePath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'

  /automation/resolution-term-rules:
    post:
      tags: [Automation]
      summary: Create resolution term rule
      security: [{ cookieAuth: [] }]
      responses:
        '302':
          $ref: '#/components/responses/Redirect'

  /automation/resolution-term-rules/{resolution_term_rule}:
    put:
      tags: [Automation]
      summary: Update resolution term rule
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/resolutionTermRulePath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
    delete:
      tags: [Automation]
      summary: Delete resolution term rule
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/resolutionTermRulePath'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'

  /map:
    get:
      tags: [Map]
      summary: Map page
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          $ref: '#/components/responses/HtmlOk'
        '403':
          $ref: '#/components/responses/Forbidden'

  /map/address-search:
    get:
      tags: [Map]
      summary: Address search (JSON)
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Search query.
        - in: query
          name: mode
          required: false
          schema: { type: string, enum: [all, number, address] }
          description: Search mode.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        '403':
          $ref: '#/components/responses/ForbiddenJson'

  /problems/assign:
    get:
      tags: [Problems]
      summary: Assign problems page
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/HtmlOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Problems]
      summary: Assign problems (bulk)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignProblemsRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/AssignProblemsRequest' }
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /problems/assign/email:
    post:
      tags: [Problems]
      summary: Send manual assign email
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /problems/export:
    get:
      tags: [Problems]
      summary: Export problems (xlsx)
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: scope
          required: false
          schema: { type: string, enum: [current_page, all] }
      responses:
        '200':
          description: XLSX file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /problems/bulk-update-status:
    post:
      tags: [Problems]
      summary: Bulk update status
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /problems/bulk-update-publish:
    post:
      tags: [Problems]
      summary: Bulk update publish flag
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /problems/{problem}/assign:
    get:
      tags: [Problems]
      summary: Assign single problem page
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200': { $ref: '#/components/responses/HtmlOk' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /problems/{problem}/assign-institution:
    get:
      tags: [Problems]
      summary: Assign institution page
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200': { $ref: '#/components/responses/HtmlOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Problems]
      summary: Assign institution
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /problems/{problem}/send-assign-email:
    post:
      tags: [Problems]
      summary: Send assignment email (institution)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /problems/{problem}/return:
    patch:
      tags: [Problems]
      summary: Return problem to admin
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /problems/{problem}/reassign-institution:
    post:
      tags: [Problems]
      summary: Reassign institution
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /problems/{problem}/merge:
    get:
      tags: [Problems]
      summary: Merge page
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200': { $ref: '#/components/responses/HtmlOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Problems]
      summary: Merge problems
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '302': { $ref: '#/components/responses/Redirect' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /problems/{problem}/unmerge:
    patch:
      tags: [Problems]
      summary: Unmerge a problem
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '302': { $ref: '#/components/responses/Redirect' }

  /problems/{problem}:
    get:
      tags: [Problems]
      summary: Problem details page
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:

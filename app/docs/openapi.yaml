openapi: 3.0.3

info:
  title: Kaunas Problems API
  version: 2.0.0

tags:
  - name: Auth
  - name: VIISP
  - name: Info
  - name: Settings
  - name: Problems
  - name: Reporter
  - name: Internal
  - name: TwoFactor

servers:
  - url: /
    description: Current host
  - url: http://kauno-problemos.local
    description: Local hostname
  - url: http://185.80.129.163
    description: Live HTTP

paths:
  /api/login:
    post:
      tags: [Auth]
      summary: "[PUBLIC] Login Sanctum token"
      description: >
        Returns a Sanctum Bearer token. Mobile apps should store this token securely and
        send it on every authenticated API request as `Authorization: Bearer {token}`.
        The token has no fixed expiration (`expires_at: null`) and remains valid until
        POST `/api/logout` revokes the current token, or until the server returns 401.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiLoginRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ApiLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthTokenResponse'
                  - $ref: '#/components/schemas/LoginTwoFactorRequiredResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/two-factor/challenge:
    post:
      tags: [Auth]
      summary: "[PUBLIC] 2FA challenge"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTwoFactorChallengeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/register:
    post:
      tags: [Auth]
      summary: "[PUBLIC] Reporter registration returns token"
      description: >
        Supports two flows:
        1) normal email/password reporter registration;
        2) mobile VIISP registration completion after `/api/viisp/callback` returns `registration_required: true`.
        For VIISP, `name`, `surname`, and `viisp_personal_code_hash` come from the short-lived registration token, so the mobile app sends only `viisp_registration_token`, a real `email`, and optional `phone` / `device_name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRegisterRequest'
            examples:
              normal_registration:
                summary: Email/password registration
                value:
                  name: "Testas"
                  surname: "Pavyzdys"
                  email: "testas.reporter@example.com"
                  phone: "+37060000000"
                  password: "Aa!23456"
                  password_confirmation: "Aa!23456"
                  device_name: "mobile-ios"
              viisp_mobile_registration:
                summary: Complete VIISP mobile registration
                value:
                  viisp_registration_token: "mxaJrEwTD6ww8n01bq1bqtwJQslYbP0CYV3AJRyGSD1g9BaFcpamK8m1umhxNfoQ"
                  email: "testas.baranauskas@example.com"
                  phone: "+37060000000"
                  device_name: "mobile-ios"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/me:
    get:
      tags: [Auth]
      summary: "[AUTH] Current user profile, roles, permissions, and mobile flags"
      description: >
        Requires `Authorization: Bearer {token}`. Returns the authenticated user's profile,
        email verification state, 2FA state, VIISP linkage state, reporter notification
        preferences, roles, and permissions.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here, e.g. `Bearer 6|abc...`. Mobile/API clients should use the standard `Authorization` header.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
    delete:
      tags: [Auth]
      summary: "[AUTH] Delete (archive) current user account"
      description: >
        Archives the authenticated user's account by setting `archived_at` and revokes
        all Sanctum tokens. After this call the mobile app must clear the stored token
        and return to the guest/login state.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here, e.g. `Bearer 6|abc...`. Mobile/API clients should use the standard `Authorization` header.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      responses:
        '200':
          description: Account archived
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized

  /api/me/push-device:
    post:
      tags: [Auth]
      summary: "[AUTH] Register Firebase push device for current user"
      description: >
        Saves the mobile device push registration for the authenticated user. Firebase push
        delivery needs the `fcm_token`; `device_id` is the app/device identifier used by the
        mobile app. Calling this endpoint again replaces the previous push device fields on
        the user.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here, e.g. `Bearer 6|abc...`. Mobile/API clients should use the standard `Authorization` header.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushDeviceRegisterRequest'
            examples:
              ios:
                summary: iOS Firebase registration
                value:
                  device_id: "ios-installation-7f3f6a9d"
                  fcm_token: "fcm-token-from-firebase"
                  platform: "ios"
                  app_version: "1.0.0"
              android:
                summary: Android Firebase registration
                value:
                  device_id: "android-installation-7f3f6a9d"
                  fcm_token: "fcm-token-from-firebase"
                  platform: "android"
                  app_version: "1.0.0"
      responses:
        '200':
          description: Push device saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDeviceRegisterResponse'
        '401':
          description: Unauthorized
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/me/push-test:
    post:
      tags: [Auth]
      summary: "[AUTH] Send a test FCM push to current user"
      description: >
        Sends a Firebase Cloud Messaging push to the device registered via
        POST `/api/me/push-device`. Useful for verifying that the mobile client
        is correctly wired up. Requires `FIREBASE_CREDENTIALS` to be configured
        on the server (path to the Firebase service account JSON file).
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                  example: "Kauno problemos"
                body:
                  type: string
                  maxLength: 240
                  example: "Tai bandomasis pranešimas."
      responses:
        '200':
          description: Push dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
        '422':
          description: Push device not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyError'

  /api/settings/password:
    put:
      tags: [Settings]
      summary: "[AUTH] Update or set local password"
      description: >
        Updates the authenticated user's password. For VIISP-only users that have not
        yet set a local password (`viisp_local_password_set_at` is null), `current_password`
        is omitted — this is the "create local password" flow. For everyone else
        `current_password` is required.

        Validation follows the active `PasswordPolicy` and rejects passwords containing
        the user's name, surname, or email.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                current_password:
                  type: string
                  description: Required for users with an existing local password. Omit for VIISP first-time password creation.
                  example: "OldPass!23"
                password:
                  type: string
                  description: New password. Must satisfy the active password policy.
                  example: "NewStrong!23"
                password_confirmation:
                  type: string
                  description: Must equal `password`.
                  example: "NewStrong!23"
            examples:
              regular_change:
                summary: Standard password change
                value:
                  current_password: "OldPass!23"
                  password: "NewStrong!23"
                  password_confirmation: "NewStrong!23"
              viisp_first_password:
                summary: VIISP user creating a local password for the first time
                value:
                  password: "NewStrong!23"
                  password_confirmation: "NewStrong!23"
      responses:
        '200':
          description: Password saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slaptažodis pakeistas."
                  viisp_local_password_set:
                    type: boolean
                    example: false
        '401':
          description: Unauthorized
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/setting/email_notifications:
    patch:
      tags: [Settings]
      summary: "[AUTH] Update reporter email notification settings"
      description: >
        Requires `Authorization: Bearer {token}`. Updates the current user's reporter email
        notification switches used by the mobile app settings screen.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here, e.g. `Bearer 6|abc...`. Mobile/API clients should use the standard `Authorization` header.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailNotificationSettingsUpdateRequest'
            examples:
              enabled:
                summary: Enable reporter email notifications
                value:
                  reporter_email_own_problems: true
                  reporter_email_watched_problems: true
              disabled:
                summary: Disable reporter email notifications
                value:
                  reporter_email_own_problems: false
                  reporter_email_watched_problems: false
      responses:
        '200':
          description: Email notification settings saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailNotificationSettingsResponse'
        '401':
          description: Unauthorized
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/logout:
    post:
      tags: [Auth]
      summary: "[AUTH] Logout revokes current token"
      description: >
        Revokes only the current Bearer token used for this request. After logout, mobile
        apps must delete the stored token locally and navigate back to guest/login state.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized

  /api/viisp/init:
    post:
      tags: [VIISP]
      summary: "[PUBLIC] Initialize VIISP mobile login flow"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViispInitRequest'
      responses:
        '200':
          description: Redirect URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViispInitResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: VIISP unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyError'

  /api/viisp/callback:
    get:
      tags: [VIISP]
      summary: "[PUBLIC] VIISP callback endpoint for mobile flow"
      description: >
        Called after VIISP authentication. Existing VIISP users receive a Sanctum Bearer token immediately.
        New VIISP identities receive a short-lived `registration_token`; send it to POST `/api/register`
        with a real email address to finish mobile registration.
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Existing user token or new-user VIISP registration token
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthTokenResponse'
                  - $ref: '#/components/schemas/ViispRegistrationRequiredResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: VIISP identity exchange failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyError'
        '503':
          description: VIISP unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyError'

  /api/viisp/exchange:
    post:
      tags: [VIISP]
      summary: "[PUBLIC] Exchange VIISP callback code for Sanctum token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViispExchangeRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyError'

  /api/problems:
    get:
      tags: [Problems]
      summary: "[PUBLIC] Problems list"
      description: "No authentication required. Returns only publicly published problems."
      parameters:
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Problems]
      summary: "[AUTH] Create reporter problem"
      description: >
        Requires authentication (Bearer) and reporter role.
        Call GET /api/reporter/report-meta first.
        Nuotraukoms / vaizdams: multipart/form-data (rekomenduojama Swagger ir mobilėje). Alternatyva: application/json su files kaip base64 (JsonFileUploadItem).
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Upload-Channel
          required: false
          description: Upload channel from GET /api/info/file-upload-settings.
          schema:
            type: string
            enum: [web, mobile]
            default: web
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReporterProblemCreateMultipartRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ReporterProblemCreateRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ok, problem_id, attachments]
                properties:
                  ok:
                    type: boolean
                    example: true
                  problem_id:
                    type: integer
                    example: 123
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicAttachment'
        '401':
          description: Unauthorized
        '403':
          description: No permission
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/problems/{problem}:
    get:
      tags: [Problems]
      summary: "[PUBLIC] Problem details"
      description: "No authentication required. Returns only public problem details."
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProblemResponse'
        '404':
          description: Problem not found or not public

  /api/problems/{problem}/watch:
    post:
      tags: [Reporter]
      summary: "[AUTH] Toggle watch for reporter on problem"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: Toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  watched:
                    type: boolean
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/problems/{problem}/attachments:
    post:
      tags: [Reporter]
      summary: "[AUTH] Upload attachments to existing problem"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
        - in: header
          name: X-Upload-Channel
          required: false
          schema:
            type: string
            enum: [web, mobile]
            default: web
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProblemAttachmentsUploadMultipartRequest'
            encoding:
              files:
                style: form
                explode: true
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemAttachmentsUploadRequest'
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicAttachment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/problems/{problem}/attachments/{attachment}:
    delete:
      tags: [Reporter]
      summary: "[AUTH] Delete problem attachment"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
        - $ref: '#/components/parameters/attachmentPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/problems/{problem}/review-progress:
    get:
      tags: [Reporter]
      summary: "[AUTH] Get problem review progress entries"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/info/statistics:
    get:
      tags: [Info]
      summary: "[PUBLIC] Public statistics data JSON"
      parameters:
        - in: query
          name: period
          required: false
          description: "Period filter. Allowed values: all, week, month, quarter, year."
          schema:
            type: string
            enum: [all, week, month, quarter, year]
            default: all
          example: month
        - in: query
          name: category
          required: false
          description: "Category name or all."
          schema:
            type: string
            default: all
          example: all
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatisticsResponse'

  /api/info/map:
    get:
      tags: [Info]
      summary: "[PUBLIC] Public map problems data JSON"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapResponse'

  /api/content/{type}:
    get:
      tags: [Info]
      summary: "[PUBLIC] Public CMS content by type JSON"
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [faq, privacy, cookies, contacts, help]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContentResponse'
        '404':
          description: Not found

  /api/info/file-upload-settings:
    get:
      tags: [Info]
      summary: "[AUTH] File upload limits and settings JSON"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadSettingsResponse'
        '401':
          description: Unauthorized

  /api/reporter/problems:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter own problems list (all statuses)"
      description: >
        Returns ALL problems reported by the authenticated reporter — every status,
        including archived/merged children — matching the Reporter page 'Sąrašas' in
        the web app. Optional query parameters narrow the result by free text, report
        number, category, and date range.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: report_number
          required: false
          schema:
            type: string
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterProblemsListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter

  /api/reporter/map:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter dashboard map (own + public problems)"
      description: >
        Returns problems for the authenticated reporter's dashboard map.
        Default: all publicly published problems (any reporter) + the authenticated
        reporter's own problems regardless of publish state. With ?only_mine=1 only
        the authenticated reporter's own problems are returned. The reporter's own
        problems with status "neuzregistruota" are returned as "nauja" (display-only
        normalization for the map).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: only_mine
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter

  /api/reporter/problems/{problem}:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter own problem details"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterProblemShowResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter
        '404':
          description: Not found

  /api/reporter/statistics:
    get:
      tags: [Reporter]
      summary: "[AUTH] Reporter statistics authenticated"
      description: "Same data model used by the web reporter statistics page."
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          required: false
          description: "Period filter. If omitted, full scope is returned."
          schema:
            type: string
            enum: [all, 6, 12, year, week, month, quarter]
            default: all
          example: 12
        - in: query
          name: category

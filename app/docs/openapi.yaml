components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: Paste token value from POST /api/login into Authorize without Bearer prefix.

  parameters:
    problemPath:
      in: path
      name: problem
      required: true
      schema:
        type: integer
    attachmentPath:
      in: path
      name: attachment
      required: true
      schema:
        type: integer
    entryPath:
      in: path
      name: entry
      required: true
      schema:
        type: integer

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LaravelValidationErrorResponse'

  schemas:
    ApiLoginRequest:
      type: object
      required: [email, password, login_type]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        login_type:
          type: string
          enum: [pareiskejas, darbuotojas]
          default: darbuotojas
          description: Login type must match account role.
        device_name:
          type: string
          description: Optional. Sanctum token label. If omitted, backend uses a default value.
          example: api-client

    ApiRegisterRequest:
      oneOf:
        - $ref: '#/components/schemas/ApiPasswordRegisterRequest'
        - $ref: '#/components/schemas/ApiViispRegisterRequest'

    ApiPasswordRegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          description: Required for normal email/password registration.
        surname:
          type: string
          nullable: true
          description: Optional. Stored in users.surname.
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
          maxLength: 32
          example: "+37060000000"
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
        device_name:
          type: string
          nullable: true
          example: mobile-ios

    ApiViispRegisterRequest:
      type: object
      required: [viisp_registration_token, email]
      properties:
        viisp_registration_token:
          type: string
          minLength: 64
          maxLength: 64
          description: Short-lived token returned from GET /api/viisp/callback when registration_required is true.
        email:
          type: string
          format: email
          description: Required real email for the new account. Do not send the generated @viisp.local placeholder.
        phone:
          type: string
          nullable: true
          maxLength: 32
          example: "+37060000000"
        device_name:
          type: string
          nullable: true
          example: mobile-ios

    PushDeviceRegisterRequest:
      type: object
      required: [device_id, fcm_token]
      properties:
        device_id:
          type: string
          maxLength: 255
          description: Stable app/device installation id generated by the mobile app.
          example: ios-installation-7f3f6a9d
        fcm_token:
          type: string
          maxLength: 4096
          description: Firebase Cloud Messaging registration token from the mobile Firebase SDK.
          example: fcm-token-from-firebase
        platform:
          type: string
          nullable: true
          enum: [ios, android, web]
          example: ios
        app_version:
          type: string
          nullable: true
          maxLength: 64
          example: 1.0.0

    PushDeviceRegisterResponse:
      type: object
      required: [ok, device]
      properties:
        ok:
          type: boolean
          example: true
        device:
          type: object
          required: [device_id, registered_at]
          properties:
            device_id:
              type: string
              example: ios-installation-7f3f6a9d
            platform:
              type: string
              nullable: true
              example: ios
            app_version:
              type: string
              nullable: true
              example: 1.0.0
            registered_at:
              type: string
              format: date-time

    EmailNotificationSettingsUpdateRequest:
      type: object
      required: [reporter_email_own_problems, reporter_email_watched_problems]

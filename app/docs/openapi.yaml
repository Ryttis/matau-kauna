              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden not reporter

  /api/internal/two-factor/users:
    get:
      tags: [TwoFactor]
      summary: "[AUTH] Darbuotojai ir 2FA būsena"
      description: "Grąžina `users` (paginacija) ir `global_required` (slaptažodžio politika)."
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorUsersListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Prieiga uždrausta

  /api/internal/two-factor/users/{user}:
    post:
      tags: [TwoFactor]
      summary: "[AUTH] Įjungti / išjungti 2FA naudotojui"
      security:
        - bearerAuth: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorToggleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorUserUpdateResponse"
        "401":
          description: Unauthorized
        "403":
          description: Prieiga uždrausta
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/two-factor/global:
    post:
      tags: [TwoFactor]
      summary: "[AUTH] Globalus 2FA visiems darbuotojams"
      description: "Įjungus: nustato slaptažodžio politikos 2FA ir `two_factor_enabled` visiems staff; išjungus: visiems `two_factor_enabled: false`."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorToggleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorOkMessageResponse"
        "401":
          description: Unauthorized
        "403":
          description: Prieiga uždrausta
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/two-factor/disable-all-staff:
    post:
      tags: [TwoFactor]
      summary: "[AUTH] Išjungti 2FA visiems darbuotojams"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorOkMessageResponse"
        "401":
          description: Unauthorized
        "403":
          description: Prieiga uždrausta

  /api/internal/institutions:
    get:
      tags: [Internal]
      summary: "[AUTH] List institutions (id, name, code) for bulk assign"
      description: Same access as POST /api/internal/problems/assign (system or problem admin). Active, non-archived institutions only. Use returned id as institution_id.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalInstitutionsListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/internal/problems:
    get:
      tags: [Internal]
      summary: "[AUTH] Staff problems list"
      description: Bearer required. Permission issues.view. Same filters and scope as web staff dashboard. Public catalogue stays GET /api/problems.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: report_number
          required: false
          schema:
            type: string
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: sort_by
          required: false
          schema:
            type: string
            default: created_at
        - in: query
          name: sort_direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/internal/problems/{problem}:
    get:
      tags: [Internal]
      summary: "[AUTH] Staff problem detail"
      description: Bearer required. Permission issues.view. Returns full problem with institution, nature and attachments.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalProblemDetail"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    post:
      tags: [Internal]
      summary: "[AUTH] Update problem (classification fields and optional attachments)"
      description: Priedams rekomenduojama multipart/form-data; alternatyva - JSON su files base64.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/InternalProblemUpdateMultipartRequest"
            encoding:
              files:
                style: form
                explode: true
          application/json:
            schema:
              $ref: "#/components/schemas/InternalProblemUpdateRequestJson"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalProblemUpdateResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Internal]
      summary: "[AUTH] Archive problem and merge group"
      description: Requires delete permission. Archives related merged problems.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalProblemArchiveResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/internal/problems/{problem}/attachments:
    post:
      tags: [Internal]
      summary: "[AUTH-InternalStaff] Add attachments to a problem"
      description: >
        Used by the internal "Problemos detalė" page when staff edits a problem and
        uploads photos/videos without changing other fields. Requires
        `canEditProblemClassification` permission. Files go through the same upload
        validation as the reporter flow. Multipart upload, field name `files[]`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttachmentPublicPayload"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/problems/{problem}/attachments/{attachment}:
    delete:
      tags: [Internal]
      summary: "[AUTH-InternalStaff] Delete attachment from problem"
      description: >
        Used by the internal "Problemos detalė" page to remove a previously uploaded
        photo/video. Requires `canEditProblemClassification` permission. Removes the
        file from disk and the database row.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
        - in: path
          name: attachment
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Attachment not found on this problem

  /api/internal/problems/{problem}/status:
    patch:
      tags: [Internal]
      summary: "[AUTH] Update status for merge group"
      description: All staff workflow statuses allowed except nauja. Logs a status change entry to the problem review history and notifies reporters and watchers when the status changes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalProblemStatusUpdateRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalProblemStatusBatchResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/problems/{problem}/publish:
    patch:
      tags: [Internal]
      summary: "[AUTH] Publish or unpublish public visibility"
      description: Requires publish permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalProblemPublishUpdateRequest"
      responses:
        "200":
          description: Publish toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalProblemPublishBatchResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/problems/{problem}/merge:
    post:
      tags: [Internal]
      summary: "[AUTH] Merge other problems into this root"
      description: JSON API. problem_ids lists problems to merge under this path problem id root.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalProblemMergeRequest"
      responses:
        "200":
          description: Merged or no changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalProblemMergeResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/problems/assign:
    post:
      tags: [Internal]
      summary: "[AUTH] Bulk assign to institution admin"
      description: Same as web POST `/problems/assign` (route `problems.assign.store`). problem_ids may contain one or many ids. institution_id from GET /api/internal/institutions. System or problem admin only; optional status in the same request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalBulkAssignRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAssignBulkResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          description: Validation error or resolved problems blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/internal/problems/assign/email:
    post:
      tags: [Internal]
      summary: "[AUTH] Assign to institution and send notification email"
      description: Mirrors web POST `/problems/assign/email` (route `problems.assign.email`). Assigns problems to the institution that owns the selected email, then sends a manual assignment email. System or problem admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalAssignSendEmailRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAssignSendEmailResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          description: Validation error, email mismatch or resolved problems blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/internal/problems/{problem}/assign-institution-options:
    get:
      tags: [Internal]
      summary: "[AUTH] Assign-institution picker (employees, teams, institutions)"
      description: Same data as web page GET /problems/{problem}/assign-institution. Use returned ids for POST assign-institution (exactly one of employee_id or institution_team_id). employees/teams require user institution context; may be empty for users without institution_id.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAssignInstitutionOptionsResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          description: Resolved problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/internal/institution-teams/{team}/members:
    get:
      tags: [Internal]
      summary: "[AUTH] Institution team members (assignable employees)"
      description: Returns assignable employees of the given team. The team must belong to the authenticated user's institution. Used by the mobile institution-assign flow to preview team members before picking the team.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: team
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, team, members]
                properties:
                  ok:
                    type: boolean
                  team:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, name, email]
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/internal/problems/{problem}/assign-institution:
    post:
      tags: [Internal]
      summary: "[AUTH] Assign inside institution to employee or team"
      description: Send exactly one of employee_id or institution_team_id. Valid ids from GET .../assign-institution-options on the same problem.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalInstitutionAssignRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalOkProblemId"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          description: Bad assignment payload empty team or resolved problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/internal/problems/{problem}/assign-institution/send-email:
    post:
      tags: [Internal]
      summary: "[AUTH] Send institution-share email to an assignable institution employee"
      description: >
        Mirrors web POST `/problems/{problem}/send-assign-email`
        (route `problems.assignInstitution.sendEmail`). Requires `issues.assign` and the user's
        institution context. The `email` must belong to an assignable employee of the same
        institution. Sends the institution-share email built by `ProblemAssignmentNotifier`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  problem_id:
                    type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          description: Validation error, resolved problem, or email not in assignable employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/internal/problems/{problem}/reassign-institution:
    post:
      tags: [Internal]
      summary: "[AUTH] Reassign to another institution"
      description: JSON API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalInstitutionReassignRequest"
      responses:
        "200":
          description: Reassigned or already at institution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalOkProblemId"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          description: Problem already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/internal/problems/{problem}/unmerge:
    patch:
      tags: [Internal]
      summary: "[AUTH] Unmerge problem from group"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalOkProblemId"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/internal/problems/{problem}/return:
    patch:
      tags: [Internal]
      summary: "[AUTH] Return problem to admin from institution context"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalOkProblemId"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/internal/problems/{problem}/review-progress:
    get:
      tags: [Internal]
      summary: "[AUTH-InternalStaff] View full review progress (incl. internal entries)"
      description: >
        Used by the internal "Pranešimų eiga" page. Returns ALL entries (both Public and
        Internal-only). Reporter view at `/api/problems/{problem}/review-progress`
        returns only Public entries.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    post:
      tags: [Internal]
      summary: "[AUTH-InternalStaff] Add review entry (comment, status, attachments)"
      description: >
        Used by the internal "Pranešimų eiga" page when staff posts a new entry.
        A single entry can include: comment text, a status change for the problem,
        responsible person, visibility (Public/Internal), and uploaded photos/videos.
        Multipart upload, field name `files[]`. Any staff with access to the problem
        can post. When `status` is `neaktuali`, `comment` is required and must be non-empty.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
        - in: header
          name: X-Upload-Channel
          required: false
          schema:
            type: string
            enum: [web, mobile]
            default: web
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReviewProgressUpsertMultipartRequest"
            encoding:
              files:
                explode: true
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProgressUpsertRequestJson"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgressOkResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/problems/{problem}/review-progress/{entry}:
    put:
      tags: [Internal]
      summary: "[AUTH-InternalStaff] Edit a review entry (JSON only, no file upload)"
      description: >
        Used by the internal "Pranešimų eiga" page to edit an existing entry. System
        Admin can edit any entry; regular staff can only edit entries they themselves
        created. Use this PUT for JSON-only updates without files; for adding new
        files use the multipart POST below.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
        - $ref: "#/components/parameters/entryPath"
        - in: header
          name: X-Upload-Channel
          required: false
          schema:
            type: string
            enum: [web, mobile]
            default: web
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProgressPartialBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgressOkResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Internal]
      summary: "[AUTH-InternalStaff] Edit a review entry (multipart, with new files)"
      description: >
        Same as the PUT endpoint above but accepts multipart/form-data so new
        photos/videos can be appended to the entry. Permissions identical: System Admin
        can edit any entry, regular staff only their own.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
        - $ref: "#/components/parameters/entryPath"
        - in: header
          name: X-Upload-Channel
          required: false
          schema:
            type: string
            enum: [web, mobile]
            default: web
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReviewProgressPartialMultipartRequest"
            encoding:
              files:
                explode: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgressOkResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/problems/{problem}/review-progress/attachments/{attachment}:
    delete:
      tags: [Internal]
      summary: "[AUTH-InternalStaff] Delete a single review-progress file"
      description: >
        Used by the internal "Pranešimų eiga" page when staff removes a single
        photo/video from a review entry. Permissions: System Admin can delete any
        attachment; regular staff only files on entries they themselves authored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
        - $ref: "#/components/parameters/attachmentPath"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/internal/problems/bulk-update-status:
    post:
      tags: [Internal]
      summary: "[AUTH] Bulk update status"
      description: All staff workflow statuses allowed except nauja. For each affected merge-group root, logs a status change entry to the review history and notifies reporters and watchers when the status changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalBulkStatusUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalBulkStatusResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/problems/bulk-destroy:
    post:
      tags: [Internal]
      summary: "[AUTH] Bulk archive"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalBulkIdsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalBulkArchiveResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/internal/problems/bulk-update-publish:
    post:
      tags: [Internal]
      summary: "[AUTH] Bulk update publish flag"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalBulkPublishUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalBulkPublishResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: Paste token value from POST /api/login into Authorize without Bearer prefix.

  parameters:
    problemPath:
      in: path
      name: problem
      required: true
      schema:
        type: integer
    attachmentPath:
      in: path
      name: attachment
      required: true
      schema:
        type: integer
    entryPath:
      in: path
      name: entry
      required: true
      schema:
        type: integer

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LaravelValidationErrorResponse"

  schemas:
    AttachmentPublicPayload:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        mime_type:
          type: string
        kind:
          type: string
          description: "image | video | other"
        size_bytes:
          type: integer

    ApiLoginRequest:
      type: object
      required: [email, password, login_type]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        login_type:
          type: string
          enum: [pareiskejas, darbuotojas]
          default: darbuotojas
          description: Login type must match account role.
        device_name:
          type: string
          description: Optional. Sanctum token label. If omitted, backend uses a default value.
          example: api-client

    ApiRegisterRequest:
      oneOf:
        - $ref: "#/components/schemas/ApiPasswordRegisterRequest"
        - $ref: "#/components/schemas/ApiViispRegisterRequest"

    ApiPasswordRegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          description: Required for normal email/password registration.
        surname:
          type: string
          nullable: true
          description: Optional. Stored in users.surname.
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
          maxLength: 32
          example: "+37060000000"
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
        device_name:
          type: string
          nullable: true
          example: mobile-ios

    ApiViispRegisterRequest:
      type: object
      required: [viisp_registration_token, email]
      properties:
        viisp_registration_token:
          type: string
          minLength: 64
          maxLength: 64
          description: Short-lived token returned from GET /viisp/mobile-callback when registration_required is true.
        email:
          type: string
          format: email
          description: Required real email for the new account. Do not send the generated @viisp.local placeholder.
        phone:
          type: string
          nullable: true
          maxLength: 32
          example: "+37060000000"
        device_name:
          type: string
          nullable: true
          example: mobile-ios

    PushDeviceRegisterRequest:
      type: object
      required: [device_id, fcm_token]
      properties:
        device_id:
          type: string
          maxLength: 255
          description: Stable app/device installation id generated by the mobile app.
          example: ios-installation-7f3f6a9d
        fcm_token:
          type: string
          maxLength: 4096
          description: Firebase Cloud Messaging registration token from the mobile Firebase SDK.
          example: fcm-token-from-firebase
        platform:
          type: string
          nullable: true
          enum: [ios, android, web]
          example: ios
        app_version:
          type: string
          nullable: true
          maxLength: 64
          example: 1.0.0

    PushDeviceRegisterResponse:
      type: object
      required: [ok, device]
      properties:
        ok:
          type: boolean
          example: true
        device:
          type: object
          required: [device_id, registered_at]
          properties:
            device_id:
              type: string
              example: ios-installation-7f3f6a9d
            platform:
              type: string
              nullable: true
              example: ios
            app_version:
              type: string
              nullable: true
              example: 1.0.0
            registered_at:
              type: string
              format: date-time

    EmailNotificationSettingsUpdateRequest:
      type: object
      required: [reporter_email_own_problems, reporter_email_watched_problems]
      properties:
        reporter_email_own_problems:
          type: boolean
          description: Send email updates for problems created by the current reporter.
          example: true
        reporter_email_watched_problems:
          type: boolean
          description: Send email updates for problems watched by the current reporter.
          example: false

    EmailNotificationSettingsResponse:
      type: object
      required: [ok, email_notifications]
      properties:
        ok:
          type: boolean
          example: true
        email_notifications:
          type: object
          required:
            [reporter_email_own_problems, reporter_email_watched_problems]
          properties:
            reporter_email_own_problems:
              type: boolean
              example: true
            reporter_email_watched_problems:
              type: boolean
              example: false

    ViispInitRequest:
      type: object
      required: [redirect_uri]
      properties:
        redirect_uri:
          type: string
          description: Mobile deep link, e.g. kaunoproblemos://auth/viisp
        device_name:
          type: string
          nullable: true
          description: Sanctum token name to use if VIISP callback logs in an existing user.
          example: mobile-ios

    ViispInitResponse:
      type: object
      required: [state, redirect_url]
      properties:
        state:
          type: string
        redirect_url:
          type: string

    ViispRegistrationRequiredResponse:
      type: object
      required:
        [
          registration_required,
          next_step,
          registration_token,
          token_type,
          expires_in,
          registration_endpoint,
          required_fields,
          user,
        ]
      properties:
        registration_required:
          type: boolean
          example: true
        next_step:
          type: string
          example: complete_registration
        registration_token:
          type: string
          description: Send this to POST /api/register as viisp_registration_token.
          example: mxaJrEwTD6ww8n01bq1bqtwJQslYbP0CYV3AJRyGSD1g9BaFcpamK8m1umhxNfoQ
        token_type:
          type: string
          example: VIISPRegistration
        expires_in:
          type: integer
          example: 600
        registration_endpoint:
          type: string
          example: http://localhost:85/api/register
        required_fields:
          type: array
          items:
            type: string
          example: [viisp_registration_token, email]
        user:
          type: object
          required: [name, surname, email]
          properties:
            name:
              type: string
              example: TESTULIS
            surname:
              type: string
              example: DUNDULIS
            email:
              type: string
              example: viisp.6ad61ffa7259cae69ab08f02a03de12d@viisp.local
            phone:
              type: string
              nullable: true

    ViispExchangeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 64
          maxLength: 64
        device_name:
          type: string
          example: mobile-ios

    AuthTokenResponse:
      type: object
      required: [token, token_type, expires_at, user]
      description: >
        Store `token` securely on mobile and send it on authenticated endpoints as
        `Authorization: Bearer {token}`. `expires_at: null` means the token is valid until
        revoked by POST /api/logout or rejected by the server with 401.
      properties:
        token:
          type: string
          example: 1|verylongtoken...
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: null
        user:
          $ref: "#/components/schemas/UserSummary"

    LoginTwoFactorRequiredResponse:
      type: object
      required: [two_factor_required, login_token]
      properties:
        two_factor_required:
          type: boolean
          const: true
        login_token:
          type: string
          description: Naudokite POST /api/two-factor/challenge su šiuo lauku ir 6 skaitmenų TOTP.
        needs_setup:
          type: boolean
          description: "Jei true – programėlė dar nepatvirtinta: naudokite `setup_qr_image_url` / `setup_secret`, tada POST /api/two-factor/challenge"
        setup_secret:
          type: string
        otpauth_url:
          type: string
        setup_qr_image_url:
          type: string
          format: uri

    ApiTwoFactorChallengeRequest:
      type: object
      required: [login_token, code]
      properties:
        login_token:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "123456"

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email

    MeResponse:
      type: object
      required:
        - id
        - name
        - email
        - email_verified
        - two_factor_enabled
        - viisp_linked
        - can_authenticate_with_email_password
        - email_notifications_enabled
        - email_updates_institution_admin
        - reporter_email_own_problems
        - reporter_email_watched_problems
        - roles
        - permissions
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: TESTULIS
        surname:
          type: string
          nullable: true
          example: DUNDULIS
        email:
          type: string
          format: email
          example: testas.baranauskas@example.com
        phone:
          type: string
          nullable: true
          example: "+37060000000"
        email_verified:
          type: boolean
          description: True when email_verified_at is not null.
          example: false
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        two_factor_enabled:
          type: boolean
          description: Whether 2FA is enabled for this user.
          example: false
        two_factor_confirmed_at:
          type: string
          format: date-time
          nullable: true
        viisp_linked:
          type: boolean
          description: True when the user has viisp_personal_code_hash set. The hash itself is not exposed.
          example: true
        can_authenticate_with_email_password:
          type: boolean
          description: False for VIISP-only users until they set a local password.
          example: false
        email_notifications_enabled:
          type: boolean
          example: true
        email_updates_institution_admin:
          type: boolean
          example: true
        reporter_email_own_problems:
          type: boolean
          example: true
        reporter_email_watched_problems:
          type: boolean
          example: true
        push_notifications_registered:
          type: boolean
          description: True when a Firebase FCM token is saved for this user.
          example: true
        push_device_id:
          type: string
          nullable: true
          example: ios-installation-7f3f6a9d
        push_platform:
          type: string
          nullable: true
          enum: [ios, android, web]
          example: ios
        push_app_version:
          type: string
          nullable: true
          example: 1.0.0
        push_registered_at:
          type: string
          format: date-time
          nullable: true
        terms_accepted_at:
          type: string
          format: date-time
          nullable: true
        reporter_report_terms_accepted_at:
          type: string
          format: date-time
          nullable: true
        reporter_wizard_completed_at:
          type: string
          format: date-time
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        institution_id:
          type: integer
          nullable: true
        two_factor_globally_required:
          type: boolean
          description: Whether the system administrator has globally enabled 2FA for staff users.
          example: false
        roles:
          type: array
          items:
            type: string
          example: [reporter]
        available_roles:
          type: array
          description: All roles assigned to the user with their id, key and label. Use these in PATCH /api/me/active-role.
          items:
            type: object
            required: [id, role, name]
            properties:
              id:
                type: string
                format: uuid
              role:
                type: string
                example: ROLE_INSTITUTION_ADMIN
              name:
                type: string
                example: Įstaigos administratorius
        active_role_id:
          type: string
          format: uuid
          nullable: true
        active_role:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            role:
              type: string
            name:
              type: string
        permissions:
          type: array
          items:
            type: string
          example: []

    ReporterProblemCreateRequestBase:
      type: object
      required: [problem_type_id, description, address]
      properties:
        problem_type_id:
          type: integer
          description: Type id from GET /api/reporter/report-meta typeValues root item.
        problem_nature_id:
          type: integer
          nullable: true
          description: Optional nature id from same typeValues item natures list may differ from type id.
        description:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
          nullable: true
          description: Optional. If omitted, backend tries to resolve from address.
        lng:
          type: number
          format: double
          nullable: true
          description: Optional. If omitted, backend tries to resolve from address.

    ReporterProblemCreateRequest:
      allOf:
        - $ref: "#/components/schemas/ReporterProblemCreateRequestBase"
        - type: object
          properties:
            files:
              type: array
              description: Neprivaloma. Base64 (žr. JsonFileUploadItem).
              items:
                $ref: "#/components/schemas/JsonFileUploadItem"

    ReporterProblemCreateMultipartRequest:
      allOf:
        - $ref: "#/components/schemas/ReporterProblemCreateRequestBase"
        - type: object
          properties:
            files:
              type: array
              description: Neprivaloma. Nuotraukos / vaizdai kaip binary laukai.
              items:
                type: string
                format: binary

    PublicProblemResponse:
      type: object
      properties:
        id:
          type: integer
        internal_number:
          type: string
        status:
          type: string
        category:
          type: string
        nature:
          type: string
          nullable: true
          description: Problemos pobūdis (ProblemNature klasifikatoriaus pavadinimas).
        address:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        is_published_publicly:
          type: boolean
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/PublicAttachment"

    PublicAttachment:
      type: object
      additionalProperties: true

    JsonFileUploadItem:
      description: >
        Vienas failas JSON užklausoje: arba viena base64 eilutė (gali prasidėti data:image/jpeg;base64,),
        arba objektas su content_base64 ir neprivalomu original_name.
      oneOf:
        - type: string
        - type: object
          required: [content_base64]
          properties:
            content_base64:
              type: string
            original_name:
              type: string
              description: Failo vardas su plėtiniu, pvz. nuotrauka.jpg

    PublicMapResponse:
      type: object
      properties:
        center:
          type: object
          properties:
            lat:
              type: number
              format: double
            lng:
              type: number
              format: double
        problems:
          type: array
          items:
            type: object
            additionalProperties: true

    PublicContentResponse:
      type: object
      description: >
        Public CMS content payload. `body` carries free-form HTML for text-style pages (privacy, cookies, terms,
        contacts, help). `items` carries structured Q&A pairs for FAQ — populated only when `type=faq` and the
        published version was authored using the structured editor; otherwise it is null.
      properties:
        type:
          type: string
          enum: [terms, faq, privacy, cookies, contacts, help]
        title:

openapi: 3.0.3

info:
  title: Kaunas Problems API
  version: 2.0.0

tags:
  - name: Auth
    description: >
      [PUBLIC + AUTH] Login, registration, logout, current user profile, push device.
      Used by login screens (mobile + web), register screen, and any client that needs
      to identify the authenticated user.
  - name: VIISP
    description: >
      [PUBLIC] Lithuanian government VIISP login flow for mobile.
      Used by the mobile login screen "Prisijungti per el. valdžios vartus".
  - name: Info
    description: >
      [PUBLIC] Public guest data - public statistics, public map, public CMS content
      (FAQ, privacy, cookies, contacts, help). Used by the unauthenticated landing
      site, the public map page, and public statistics page.
  - name: Settings
    description: >
      [AUTH] Authenticated user account settings - password change/setup,
      email-notification preferences. Used by the Profile/Settings page in mobile and web.
  - name: Problems
    description: >
      [PUBLIC] Public single-problem details and public list (no role filter).
      Used by guest detail/share pages.
  - name: Reporter
    description: >
      [AUTH-Reporter] Reporter (Pareiškėjas) flows - submit a problem, view own problems
      list, statistics, dashboard map (own + public), report details. Used by mobile
      reporter screens and the corresponding web pages: "Pranešimas", "Sąrašas",
      "Statistika", "Žemėlapis" inside the reporter dashboard.
  - name: Internal
    description: >
      [AUTH-InternalStaff] Internal-staff problem management - list, edit (with
      attachments), assign to institution, change status, publish, merge/unmerge,
      review-progress comments. Used by the internal admin pages: "Sąrašas",
      "Žemėlapis", "Problemos detalė", "Nagrinėjimo eiga", "Priskyrimas".
      System Admin can manage everything; staff can only edit their own review entries.
  - name: TwoFactor
    description: >
      [AUTH-Admin] System-Admin 2FA management - list staff users, toggle per-user
      2FA, global 2FA requirement, disable for all staff. Used by the admin RBAC
      "2FA" tab.

servers:
  - url: /
    description: Current host
  - url: http://kauno-problemos.local
    description: Local hostname
  - url: http://185.80.129.163
    description: Live HTTP

paths:
  /api/login:
    post:
      tags: [Auth]
      summary: "[PUBLIC] Login Sanctum token"
      description: >
        Returns a Sanctum Bearer token. Mobile apps should store this token securely and
        send it on every authenticated API request as `Authorization: Bearer {token}`.
        The token has no fixed expiration (`expires_at: null`) and remains valid until
        POST `/api/logout` revokes the current token, or until the server returns 401.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ApiLoginRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ApiLoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthTokenResponse"
                  - $ref: "#/components/schemas/LoginTwoFactorRequiredResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/two-factor/challenge:
    post:
      tags: [Auth]
      summary: "[PUBLIC] 2FA challenge"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTwoFactorChallengeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/register:
    post:
      tags: [Auth]
      summary: "[PUBLIC] Reporter registration returns token"
      description: >
        Supports two flows:
        1) normal email/password reporter registration;
        2) mobile VIISP registration completion after `/viisp/mobile-callback` returns `registration_required: true`.
        For VIISP, `name`, `surname`, and `viisp_personal_code_hash` come from the short-lived registration token, so the mobile app sends only `viisp_registration_token`, a real `email`, and optional `phone` / `device_name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiRegisterRequest"
            examples:
              normal_registration:
                summary: Email/password registration
                value:
                  name: "Testas"
                  surname: "Pavyzdys"
                  email: "testas.reporter@example.com"
                  phone: "+37060000000"
                  password: "Aa!23456"
                  password_confirmation: "Aa!23456"
                  device_name: "mobile-ios"
              viisp_mobile_registration:
                summary: Complete VIISP mobile registration
                value:
                  viisp_registration_token: "mxaJrEwTD6ww8n01bq1bqtwJQslYbP0CYV3AJRyGSD1g9BaFcpamK8m1umhxNfoQ"
                  email: "testas.baranauskas@example.com"
                  phone: "+37060000000"
                  device_name: "mobile-ios"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/forgot-password:
    post:
      tags: [Auth]
      summary: "[PUBLIC] Send password reset link to email"
      description: >
        Sends a password reset link to the provided email address. Throttled to 6 requests per minute.
        Returns 422 if no user exists with the given email, if rate-limited, or if validation fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: testas@example.com
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Nuoroda išsiųsta į nurodytą el. paštą. Patikrinkite paštą."
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Too many requests (rate limited)

  /api/me:
    get:
      tags: [Auth]
      summary: "[AUTH] Current user profile, roles, permissions, and mobile flags"
      description: >
        Requires `Authorization: Bearer {token}`. Returns the authenticated user's profile,
        email verification state, 2FA state, VIISP linkage state, reporter notification
        preferences, roles, and permissions.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here, e.g. `Bearer 6|abc...`. Mobile/API clients should use the standard `Authorization` header.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
    delete:
      tags: [Auth]
      summary: "[AUTH] Delete (archive) current user account"
      description: >
        Archives the authenticated user's account by setting `archived_at` and revokes
        all Sanctum tokens. After this call the mobile app must clear the stored token
        and return to the guest/login state.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here, e.g. `Bearer 6|abc...`. Mobile/API clients should use the standard `Authorization` header.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      responses:
        "200":
          description: Account archived
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          description: Unauthorized

  /api/me/active-role:
    patch:
      tags: [Auth]
      summary: "[AUTH] Switch the authenticated user's active role"
      description: >
        Persists the chosen role on the user record so subsequent requests are scoped to it.
        `role_id` must match one of the role ids returned in `/api/me` `available_roles`.
        Returns the same payload as `GET /api/me` with the new active role and permissions applied.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Active role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/me/push-device:
    post:
      tags: [Auth]
      summary: "[AUTH] Register Firebase push device for current user"
      description: >
        Saves the mobile device push registration for the authenticated user. Firebase push
        delivery needs the `fcm_token`; `device_id` is the app/device identifier used by the
        mobile app. Calling this endpoint again replaces the previous push device fields on
        the user.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here, e.g. `Bearer 6|abc...`. Mobile/API clients should use the standard `Authorization` header.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceRegisterRequest"
            examples:
              ios:
                summary: iOS Firebase registration
                value:
                  device_id: "ios-installation-7f3f6a9d"
                  fcm_token: "fcm-token-from-firebase"
                  platform: "ios"
                  app_version: "1.0.0"
              android:
                summary: Android Firebase registration
                value:
                  device_id: "android-installation-7f3f6a9d"
                  fcm_token: "fcm-token-from-firebase"
                  platform: "android"
                  app_version: "1.0.0"
      responses:
        "200":
          description: Push device saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDeviceRegisterResponse"
        "401":
          description: Unauthorized
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/me/push-test:
    post:
      tags: [Auth]
      summary: "[AUTH] Send a test FCM push to current user"
      description: >
        Sends a Firebase Cloud Messaging push to the device registered via
        POST `/api/me/push-device`. Useful for verifying that the mobile client
        is correctly wired up. Requires `FIREBASE_CREDENTIALS` to be configured
        on the server (path to the Firebase service account JSON file).
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                  example: "Kauno problemos"
                body:
                  type: string
                  maxLength: 240
                  example: "Tai bandomasis pranešimas."
      responses:
        "200":
          description: Push dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          description: Unauthorized
        "422":
          description: Push device not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/settings/password:
    put:
      tags: [Settings]
      summary: "[AUTH] Update or set local password"
      description: >
        Updates the authenticated user's password. For VIISP-only users that have not
        yet set a local password (`viisp_local_password_set_at` is null), `current_password`
        is omitted - this is the "create local password" flow. For everyone else
        `current_password` is required.

        Validation follows the active `PasswordPolicy` and rejects passwords containing
        the user's name, surname, or email.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                current_password:
                  type: string
                  description: Required for users with an existing local password. Omit for VIISP first-time password creation.
                  example: "OldPass!23"
                password:
                  type: string
                  description: New password. Must satisfy the active password policy.
                  example: "NewStrong!23"
                password_confirmation:
                  type: string
                  description: Must equal `password`.
                  example: "NewStrong!23"
            examples:
              regular_change:
                summary: Standard password change
                value:
                  current_password: "OldPass!23"
                  password: "NewStrong!23"
                  password_confirmation: "NewStrong!23"
              viisp_first_password:
                summary: VIISP user creating a local password for the first time
                value:
                  password: "NewStrong!23"
                  password_confirmation: "NewStrong!23"
      responses:
        "200":
          description: Password saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slaptažodis pakeistas."
                  viisp_local_password_set:
                    type: boolean
                    example: false
        "401":
          description: Unauthorized
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/settings/profile:
    patch:
      tags: [Settings]
      summary: "[AUTH] Update own profile (name, surname, email)"
      description: >
        Used by the Settings/Profile screen. For VIISP-linked users `name` and `surname`
        are ignored (set by VIISP only) — only `email` is updated. For email/password
        users all three fields are updated.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                surname:
                  type: string
                  nullable: true
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      surname:
                        type: string
                        nullable: true
                      email:
                        type: string
                        format: email
        '401':
          description: Unauthorized
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/settings/two-factor:
    patch:
      tags: [Settings]
      summary: "[AUTH-InternalStaff] Toggle own 2FA (only when globally enabled)"
      description: >
        Used by the internal staff Settings page to opt out of 2FA for the current user.
        The System Admin's global 2FA setting controls availability:
        - If global is ON, internal staff can disable 2FA for themselves (opt-out).
        - If global is OFF, no one can enable 2FA — request returns 422.
        - Reporters cannot use this endpoint (returns 422).
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [two_factor_enabled]
              properties:
                two_factor_enabled:
                  type: boolean
            examples:
              disable_for_self:
                summary: Internal staff opts out of 2FA
                value:
                  two_factor_enabled: false
              enable_for_self:
                summary: Internal staff enables 2FA (only valid if globally on)
                value:
                  two_factor_enabled: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  two_factor_enabled:
                    type: boolean
                  two_factor_globally_required:
                    type: boolean
        '401':
          description: Unauthorized
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/setting/email_notifications:
    patch:
      tags: [Settings]
      summary: "[AUTH] Update reporter email notification settings"
      description: >
        Requires `Authorization: Bearer {token}`. Updates the current user's reporter email
        notification switches used by the mobile app settings screen.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Authorization
          required: true
          description: Swagger-only auth header. Paste full Bearer token here, e.g. `Bearer 6|abc...`. Mobile/API clients should use the standard `Authorization` header.
          schema:
            type: string
            example: "Bearer 6|qByoRAMucVQd90Q9JTG16xE3KPM3wV2imICs2Fro8907502b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailNotificationSettingsUpdateRequest"
            examples:
              enabled:
                summary: Enable reporter email notifications
                value:
                  reporter_email_own_problems: true
                  reporter_email_watched_problems: true
              disabled:
                summary: Disable reporter email notifications
                value:
                  reporter_email_own_problems: false
                  reporter_email_watched_problems: false
      responses:
        "200":
          description: Email notification settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailNotificationSettingsResponse"
        "401":
          description: Unauthorized
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/logout:
    post:
      tags: [Auth]
      summary: "[AUTH] Logout revokes current token"
      description: >
        Revokes only the current Bearer token used for this request. After logout, mobile
        apps must delete the stored token locally and navigate back to guest/login state.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          description: Unauthorized

  /api/viisp/init:
    post:
      tags: [VIISP]
      summary: "[PUBLIC] Initialize VIISP mobile login flow"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViispInitRequest"
      responses:
        "200":
          description: Redirect URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViispInitResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: VIISP unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /viisp/mobile-callback:
    get:
      tags: [VIISP]
      summary: "[PUBLIC] VIISP callback endpoint for mobile flow"
      description: >
        Called after VIISP authentication (note: NOT under `/api` prefix — sits next to the web `/viisp/callback` so it shares the same ingress route).
        Existing VIISP users receive a Sanctum Bearer token immediately.
        New VIISP identities receive a short-lived `registration_token`; send it to POST `/api/register`
        with a real email address to finish mobile registration.
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Existing user token or new-user VIISP registration token
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthTokenResponse"
                  - $ref: "#/components/schemas/ViispRegistrationRequiredResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: VIISP identity exchange failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"
        "503":
          description: VIISP unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/viisp/exchange:
    post:
      tags: [VIISP]
      summary: "[PUBLIC] Exchange VIISP callback code for Sanctum token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViispExchangeRequest"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyError"

  /api/problems:
    get:
      tags: [Problems]
      summary: "[PUBLIC] Problems list"
      description: "No authentication required. Returns only publicly published problems with status `nagrinejama` (in_review) or `atlikta` (resolved) — matches the public map filter used on web (`GuestProblemController::landing`). Excludes archived and merged child problems."
      parameters:
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Problems]
      summary: "[AUTH] Create reporter problem"
      description: >
        Requires authentication (Bearer) and reporter role.
        Call GET /api/reporter/report-meta first.
        Nuotraukoms / vaizdams: multipart/form-data (rekomenduojama Swagger ir mobilėje). Alternatyva: application/json su files kaip base64 (JsonFileUploadItem).
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Upload-Channel
          required: false
          description: Upload channel from GET /api/info/file-upload-settings.
          schema:
            type: string
            enum: [web, mobile]
            default: web
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReporterProblemCreateMultipartRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ReporterProblemCreateRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ok, problem_id, attachments]
                properties:
                  ok:
                    type: boolean
                    example: true
                  problem_id:
                    type: integer
                    example: 123
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicAttachment"
        "401":
          description: Unauthorized
        "403":
          description: No permission
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/problems/{problem}:
    get:
      tags: [Problems]
      summary: "[PUBLIC] Problem details"
      description: "No authentication required. Returns only public problem details."
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProblemResponse"
        "404":
          description: Problem not found or not public

  /api/problems/{problem}/watch:
    post:
      tags: [Reporter]
      summary: "[AUTH] Toggle watch for reporter on problem"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/problemPath"
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  watched:
                    type: boolean
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /api/problems/{problem}/review-progress:
    get:
      tags: [Reporter]

openapi: 3.0.3

info:
  title: Kaunas Problems API
  version: 2.0.0

tags:
  - name: Auth
  - name: Info
  - name: Problems
  - name: Reporter
  - name: Internal

servers:
  - url: /
    description: Current host
  - url: http://kauno-problemos.local
    description: Local hostname
  - url: http://185.80.129.163
    description: Live HTTP

paths:
  /api/login:
    post:
      tags: [Auth]
      summary: Login Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiLoginRequest'
            examples:
              darbuotojas:
                summary: Staff login example
                value:
                  email: "darbuotojas@example.com"
                  password: "Slaptazodis123!"
                  login_type: "darbuotojas"
                  device_name: "api-client"
              pareiskejas:
                summary: Reporter login example
                value:
                  email: "pareiskejas@example.com"
                  password: "Slaptazodis123!"
                  login_type: "pareiskejas"
                  device_name: "api-client"
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/register:
    post:
      tags: [Auth]
      summary: Reporter registration returns token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRegisterRequest'
            examples:
              pavyzdys:
                summary: Sample request
                value:
                  name: "Testas"
                  email: "testas.reporter@example.com"
                  password: "Aa!23456"
                  password_confirmation: "Aa!23456"
                  device_name: "api-client"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/me:
    get:
      tags: [Auth]
      summary: Current user roles and permissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized

  /api/logout:
    post:
      tags: [Auth]
      summary: Logout revokes current token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized

  /api/problems:
    get:
      tags: [Problems]
      summary: Public problems list JSON
      description: Anonymous or any user. Only problems published to the public map. Does not list all issues for staff. Staff with Bearer use GET /api/internal/problems instead.
      parameters:
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Problems]
      summary: Create problem reporter
      description: >
        Requires Bearer and reporter role. Call GET /api/reporter/report-meta first.
        problem_type_id comes from report meta typeValues item id.
        problem_nature_id is optional from the same item natures list id.
        Use multipart form data when sending files.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Upload-Channel
          required: false
          description: Upload channel from GET /api/info/file-upload-settings.
          schema:
            type: string
            enum: [web, mobile]
            default: web
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReporterProblemCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ReporterProblemCreateRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ok, problem_id]
                properties:
                  ok:
                    type: boolean
                    example: true
                  problem_id:
                    type: integer
                    example: 123
        '401':
          description: Unauthorized
        '403':
          description: No permission
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/problems/{problem}:
    get:
      tags: [Problems]
      summary: Public problem details JSON
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProblemResponse'
        '404':
          description: Problem not found or not public

  /api/info/statistics:
    get:
      tags: [Info]
      summary: Public statistics data JSON
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: string
        - in: query
          name: category
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatisticsResponse'

  /api/info/map:
    get:
      tags: [Info]
      summary: Public map problems data JSON
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapResponse'

  /api/content/{type}:
    get:
      tags: [Info]
      summary: Public CMS content by type JSON
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [faq, privacy, cookies, contacts, help]
          examples:
            faq:
              value: faq
            privacy:
              value: privacy
            help:
              value: help
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContentResponse'
        '404':
          description: Not found

  /api/info/file-upload-settings:
    get:
      tags: [Info]
      summary: File upload limits and settings JSON
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadSettingsResponse'
        '401':
          description: Unauthorized

  /api/reporter/problems:
    get:
      tags: [Reporter]
      summary: Reporter own problems list
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: report_number
          required: false
          schema:
            type: string
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterProblemsListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter

  /api/reporter/problems/{problem}:
    get:
      tags: [Reporter]
      summary: Reporter own problem details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterProblemShowResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter
        '404':
          description: Not found

  /api/reporter/statistics:
    get:
      tags: [Reporter]
      summary: Reporter statistics authenticated
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: string
            enum: [all, week, month, quarter, year]
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterStatisticsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter

  /api/reporter/report-meta:
    get:
      tags: [Reporter]
      summary: Reporter report metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporterReportMetaResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter

  /api/reporter/wizard-dismissed:
    post:
      tags: [Reporter]
      summary: Mark reporter wizard as dismissed
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter

  /api/reporter/report-terms-accepted:
    post:
      tags: [Reporter]
      summary: Mark reporter terms as accepted
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden not reporter

  /api/internal/problems:
    get:
      tags: [Internal]
      summary: Staff problems list
      description: Bearer required. Permission issues.view. Same filters and scope as web staff dashboard. Public catalogue stays GET /api/problems.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: category
          required: false
          schema:
            type: string
        - in: query
          name: report_number
          required: false
          schema:
            type: string
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: sort_by
          required: false
          schema:
            type: string
            default: created_at
        - in: query
          name: sort_direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/internal/problems/{problem}:
    put:
      tags: [Internal]
      summary: Update problem classification fields
      description: Requires classification edit permission. Access checked per user scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalProblemUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalProblemUpdateResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Internal]
      summary: Archive problem and merge group
      description: Requires delete permission. Archives related merged problems.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalProblemArchiveResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/internal/problems/{problem}/status:
    patch:
      tags: [Internal]
      summary: Update status for merge group
      description: All staff workflow statuses allowed except nauja.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalProblemStatusUpdateRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalProblemStatusBatchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/internal/problems/{problem}/publish:
    patch:
      tags: [Internal]
      summary: Publish or unpublish public visibility
      description: Requires publish permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalProblemPublishUpdateRequest'
      responses:
        '200':
          description: Publish toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalProblemPublishBatchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/internal/problems/{problem}/merge:
    post:
      tags: [Internal]
      summary: Merge other problems into this root
      description: JSON API. problem_ids lists problems to merge under this path problem id root.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalProblemMergeRequest'
      responses:
        '200':
          description: Merged or no changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalProblemMergeResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/internal/problems/assign:
    post:
      tags: [Internal]
      summary: Bulk assign to institution admin
      description: JSON API. System or problem admins only. Optional status change in same request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalBulkAssignRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAssignBulkResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error or resolved problems blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyError'

  /api/internal/problems/{problem}/assign-institution:
    post:
      tags: [Internal]
      summary: Assign inside institution to employee or team
      description: JSON API. Send only employee_id or only institution_team_id.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalInstitutionAssignRequest'
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalOkProblemId'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Bad assignment payload empty team or resolved problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyError'

  /api/internal/problems/{problem}/reassign-institution:
    post:
      tags: [Internal]
      summary: Reassign to another institution
      description: JSON API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalInstitutionReassignRequest'
      responses:
        '200':
          description: Reassigned or already at institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalOkProblemId'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Problem already resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnlyError'

  /api/internal/problems/{problem}/unmerge:
    patch:
      tags: [Internal]
      summary: Unmerge problem from group
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalOkProblemId'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/internal/problems/{problem}/return:
    patch:
      tags: [Internal]
      summary: Return problem to admin from institution context
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/problemPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalOkProblemId'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/internal/problems/bulk-update-status:
    post:
      tags: [Internal]
      summary: Bulk update status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalBulkStatusUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalBulkStatusResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/internal/problems/bulk-destroy:
    post:
      tags: [Internal]
      summary: Bulk archive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalBulkIdsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalBulkArchiveResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/internal/problems/bulk-update-publish:
    post:
      tags: [Internal]
      summary: Bulk update publish flag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalBulkPublishUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalBulkPublishResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: Paste token value from POST /api/login into Authorize without Bearer prefix.

  parameters:
    problemPath:
      in: path
      name: problem
      required: true
      schema:
        type: integer

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LaravelValidationErrorResponse'

  schemas:
    ApiLoginRequest:
      type: object
      required: [email, password, login_type]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        login_type:
          type: string
          enum: [pareiskejas, darbuotojas]
          default: darbuotojas
          description: Login type must match account role.
        device_name:
          type: string
          description: Sanctum token label shown in admin token list.
          example: api-client

    ApiRegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
        device_name:
          type: string
          example: api-client

    AuthTokenResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token:
          type: string
          example: 1|verylongtoken...
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email

    MeResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
          nullable: true
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        terms_accepted_at:
          type: string
          format: date-time
          nullable: true
        reporter_report_terms_accepted_at:
          type: string
          format: date-time
          nullable: true
        reporter_wizard_completed_at:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string

    ReporterProblemCreateRequest:
      type: object
      required: [problem_type_id, description, address]
      properties:
        problem_type_id:
          type: integer
          description: Type id from GET /api/reporter/report-meta typeValues root item.
        problem_nature_id:
          type: integer
          nullable: true
          description: Optional nature id from same typeValues item natures list may differ from type id.
        description:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        files:
          type: array
          items:
            type: string
            format: binary

    PublicProblemResponse:
      type: object
      properties:
        id:
          type: integer
        internal_number:
          type: string
        status:
          type: string
        category:
          type: string
        address:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        is_published_publicly:
          type: boolean
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/PublicAttachment'

    PublicAttachment:
      type: object
      additionalProperties: true

    PublicMapResponse:
      type: object
      properties:
        center:
          type: object
          properties:
            lat:
              type: number
              format: double
            lng:
              type: number
              format: double
        problems:
          type: array
          items:
            type: object
            additionalProperties: true

    PublicContentResponse:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        body:
          type: string

    FileUploadSettingsResponse:
      type: object
      properties:
        web:
          $ref: '#/components/schemas/FileUploadChannel'
        mobile:
          $ref: '#/components/schemas/FileUploadChannel'
      additionalProperties: true

    FileUploadChannel:
      type: object
      properties:
        allow_photo:
          type: boolean
        allow_video:
          type: boolean
        max_photo_size_kb:
          type: integer

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel session cookie.

  parameters:
    problemPath:
      in: path
      name: problem
      required: true
      schema: { type: integer }
    attachmentPath:
      in: path
      name: attachment
      required: true
      schema: { type: integer }
    entryPath:
      in: path
      name: entry
      required: true
      schema: { type: integer }
    teamPath:
      in: path
      name: team
      required: true
      schema: { type: integer }
    userPath:
      in: path
      name: user
      required: true
      schema: { type: integer }
    institutionPath:
      in: path
      name: institution
      required: true
      schema: { type: integer }
    tokenPath:
      in: path
      name: token
      required: true
      schema: { type: string }
    idPath:
      in: path
      name: id
      required: true
      schema: { type: integer }
    hashPath:
      in: path
      name: hash
      required: true
      schema: { type: string }
    rulePath:
      in: path
      name: rule
      required: true
      schema: { type: integer }
    publishRulePath:
      in: path
      name: publish_rule
      required: true
      schema: { type: integer }
    resolutionTermRulePath:
      in: path
      name: resolution_term_rule
      required: true
      schema: { type: integer }
    invitationPath:
      in: path
      name: invitation
      required: true
      schema: { type: integer }
    rolePath:
      in: path
      name: role
      required: true
      schema: { type: integer }
    groupPath:
      in: path
      name: group
      required: true
      schema: { type: integer }
    permissionPath:
      in: path
      name: permission
      required: true
      schema: { type: integer }
    typePath:
      in: path
      name: type
      required: true
      schema: { type: integer }
    valuePath:
      in: path
      name: value
      required: true
      schema: { type: integer }
    emailNotificationPath:
      in: path
      name: emailNotification
      required: true
      schema: { type: integer }
    contentVersionPath:
      in: path
      name: contentVersion
      required: true
      schema: { type: integer }
    uploadChannelHeader:
      in: header
      name: X-Upload-Channel
      required: false
      schema: { type: string }
    periodQuery:
      in: query
      name: period
      required: false
      schema: { type: string }
    categoryQuery:
      in: query
      name: category
      required: false
      schema: { type: string }

  responses:
    HtmlOk:
      description: HTML/Inertia response
      content:
        text/html:
          schema: { type: string }
    JsonOk:
      description: JSON response
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Redirect:
      description: Redirect
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden
    ForbiddenJson:
      description: Forbidden (JSON)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessageResponse' }
    NotFound:
      description: Not Found
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LaravelValidationErrorResponse' }

  schemas:
    OkResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
    MessageResponse:
      type: object
      properties:
        message: { type: string }
    LoginRequest:
      type: object
      required: [email, password, login_type]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        login_type:
          type: string
          enum: [pareiskejas, darbuotojas]
        remember: { type: boolean }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }
    ResetPasswordRequest:
      type: object
      additionalProperties: true
    ReporterProblemCreateRequest:
      type: object
      required: [problem_type_id, description, address]
      properties:
        problem_type_id: { type: integer }
        problem_nature_id: { type: integer, nullable: true }
        description: { type: string }
        address: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        files:
          type: array
          items: { type: string, format: binary }
    AssignProblemsRequest:
      type: object
      additionalProperties: true
    LaravelValidationErrorResponse:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            oneOf:
              - type: array
                items: { type: string }
              - type: string
    PublicStatisticsResponse:
      type: object
      additionalProperties: true
